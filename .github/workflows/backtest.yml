name: Insider Signal Backtest

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        period:
          - { name: "2026-05", start: "2026-05-01", end: "2026-05-31" }
          - { name: "2026-06", start: "2026-06-01", end: "2026-06-30" }
          - { name: "2026-07-08", start: "2026-07-01", end: "2026-08-25" }
    concurrency:
      group: insider-signal-backtest-${{ matrix.period.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Restore backtest checkpoint (재개용, EDGAR 재조회 방지)
        uses: actions/cache@v4
        with:
          path: data/backtest_runs
          key: insider-signal-backtest-${{ matrix.period.name }}-${{ github.run_id }}
          restore-keys: |
            insider-signal-backtest-${{ matrix.period.name }}-

      - name: 백테스트 실행 (섹터별 target/stop 실험, --sector-experiment)
        env:
          SEC_EDGAR_CONTACT: ${{ secrets.SEC_EDGAR_CONTACT }}
        run: |
          python -m insider_signal.cli backtest \
            --start ${{ matrix.period.start }} --end ${{ matrix.period.end }} \
            --sector-experiment --progress-every 500

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.period.name }}
          path: |
            data/backtest_runs/${{ matrix.period.start }}_${{ matrix.period.end }}_sector_results.csv
            data/backtest_runs/${{ matrix.period.start }}_${{ matrix.period.end }}_sector_results.sqlite3
