name: Fetch Market Caps (research, one-off)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_market_caps.py

      - uses: actions/upload-artifact@v4
        with:
          name: market-caps
          path: scripts/market_caps.csv
